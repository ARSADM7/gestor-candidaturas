<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Aplicação web para registar e acompanhar candidaturas a emprego. Funciona offline, guarda tudo no navegador.">
<title>Gestor de Candidaturas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__inner">
    <h1 class="topbar__title">Gestor de Candidaturas</h1>
    <div class="topbar__actions">
      <button class="btn btn--ghost" id="btn-export" type="button">Exportar</button>
      <label class="btn btn--ghost" for="file-import">Importar</label>
      <input type="file" id="file-import" accept="application/json" hidden>
      <button class="btn btn--primary" id="btn-new" type="button">Nova candidatura</button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="stats" aria-label="Resumo">
    <div class="stat"><span class="stat__num" id="stat-total">0</span><span class="stat__label">Total</span></div>
    <div class="stat"><span class="stat__num" id="stat-sent">0</span><span class="stat__label">Enviadas</span></div>
    <div class="stat"><span class="stat__num" id="stat-replies">0</span><span class="stat__label">Com resposta</span></div>
    <div class="stat"><span class="stat__num" id="stat-offers">0</span><span class="stat__label">Ofertas</span></div>
  </section>

  <section class="toolbar" aria-label="Filtros">
    <label class="field field--grow">
      <span class="field__label">Procurar</span>
      <input type="search" id="filter-search" placeholder="Empresa, cargo ou nota…">
    </label>
    <label class="field">
      <span class="field__label">Estado</span>
      <select id="filter-status">
        <option value="">Todos</option>
      </select>
    </label>
  </section>

  <p class="empty" id="empty" hidden>
    Ainda não há candidaturas registadas. Carrega em <strong>Nova candidatura</strong> para começar.
  </p>

  <ul class="list" id="list"></ul>

</main>

<!-- ============ Diálogo: criar/editar ============ -->
<dialog class="dialog" id="dialog">
  <form class="dialog__form" id="form" novalidate>
    <h2 class="dialog__title" id="dialog-title">Nova candidatura</h2>

    <label class="field">
      <span class="field__label">Empresa <span class="req" aria-hidden="true">*</span></span>
      <input type="text" id="f-company" required maxlength="80" autocomplete="organization">
      <span class="field__error" data-for="f-company"></span>
    </label>

    <label class="field">
      <span class="field__label">Cargo <span class="req" aria-hidden="true">*</span></span>
      <input type="text" id="f-role" required maxlength="80">
      <span class="field__error" data-for="f-role"></span>
    </label>

    <div class="field-row">
      <label class="field">
        <span class="field__label">Estado</span>
        <select id="f-status"></select>
      </label>
      <label class="field">
        <span class="field__label">Data</span>
        <input type="date" id="f-date">
      </label>
    </div>

    <label class="field">
      <span class="field__label">Link da vaga</span>
      <input type="url" id="f-link" placeholder="https://…" inputmode="url">
      <span class="field__error" data-for="f-link"></span>
    </label>

    <label class="field">
      <span class="field__label">Notas</span>
      <textarea id="f-notes" rows="3" maxlength="500" placeholder="Email enviado, contacto, requisitos…"></textarea>
    </label>

    <p class="form-error" id="form-error" role="alert" hidden></p>

    <div class="dialog__actions">
      <button type="button" class="btn btn--danger-ghost" id="btn-delete" hidden>Eliminar</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn--ghost" id="btn-cancel">Cancelar</button>
      <button type="submit" class="btn btn--primary">Guardar</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
